<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iscriviti - Scuola Normale Superiore</title>
    <link rel="stylesheet" type="text/css" href="sitoscuola.css">
</head>
<body>
    <div>
        <h2>Iscriviti</h2>
        <form action="main.html" method="GET">
            <div >
                <label for="nome">Nome</label>
                <input type="text" id="nome" name="nome" required placeholder="Inserisci il tuo nome">
            </div>
            <div>
                <label for="cognome">Cognome</label>
                <input type="text" id="cognome" name="cognome" required placeholder="Inserisci il tuo cognome">
            </div>
            <div>
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required placeholder="esempio@mail.com">
            </div>
            
            <button type="submit">Invia</button>
        </form>
    </div> 
</body>
</html>
